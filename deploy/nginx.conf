map $http_upgrade $deploy_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    root /usr/share/nginx/html/customer;
    include /etc/nginx/deploy-routes.conf;
}

server {
    listen 81;
    root /usr/share/nginx/html/pos;
    include /etc/nginx/deploy-routes.conf;
}

server {
    listen 82;
    root /usr/share/nginx/html/kds;
    include /etc/nginx/deploy-routes.conf;
}

server {
    listen 83;
    root /usr/share/nginx/html/admin;
    include /etc/nginx/deploy-routes.conf;
}
