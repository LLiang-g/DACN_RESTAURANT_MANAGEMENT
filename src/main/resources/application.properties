spring.application.name=restaurant_management

# MySQL connection (overridden by Docker/IDE environment).
spring.datasource.url=jdbc:mysql://localhost:3306/smart_pos_kds?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

jwt.secret=${JWT_SECRET}


vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:}

payment.mock.enabled=${PAYMENT_MOCK_ENABLED:false}
payment.mock.webhook-secret=${MOCK_WEBHOOK_SECRET:}

vnpay.enabled=${VNPAY_ENABLED:false}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# Demo accounts for local testing. Set enabled=false outside development.
app.seed.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:false}
app.seed.demo-accounts.admin-password=${DEMO_ADMIN_PASSWORD:}
app.seed.demo-accounts.manager-password=${DEMO_MANAGER_PASSWORD:}
app.seed.demo-accounts.kitchen-password=${DEMO_KITCHEN_PASSWORD:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.admin.upload-dir=${ADMIN_UPLOAD_DIR:uploads/admin}

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
