services:
  backend:
    environment:
      VNPAY_QUERY_URL: ${VNPAY_QUERY_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_QUERY_IP: ${VNPAY_QUERY_IP:-127.0.0.1}
      VNPAY_QUERY_RETRY_SECONDS: ${VNPAY_QUERY_RETRY_SECONDS:-60}
      PAYMENT_RECONCILE_ENABLED: ${PAYMENT_RECONCILE_ENABLED:-true}
      PAYMENT_RECONCILE_SCAN_MS: ${PAYMENT_RECONCILE_SCAN_MS:-15000}
      VNPAY_EXPIRE_SECONDS: ${VNPAY_EXPIRE_SECONDS:-90}
