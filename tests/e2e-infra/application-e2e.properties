# Loaded only by the isolated E2E compose stack. Never enable against application data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=file:/e2e/boot-reset.sql,file:/e2e/seed.sql
spring.sql.init.continue-on-error=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
app.seed.demo-accounts.enabled=false
app.admin.upload-dir=/app/uploads/admin
app.invoice.empty-grace-minutes=10
app.invoice.scan-interval-ms=30000
vnpay.enabled=false
payment.mock.enabled=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.error.include-message=never
