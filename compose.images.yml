# Standalone server stack: do not combine with docker-compose.yml/compose.deploy.yml.
name: smart-pos-kds

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql-db:
    image: ${DATABASE_IMAGE:?Use images.env from a published release}
    restart: unless-stopped
    mem_limit: 640m
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set the server password}
      MYSQL_DATABASE: smart_pos_kds
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *bounded-logs
    networks: [application]

  backend:
    image: ${BACKEND_IMAGE:?Use images.env from a published release}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/smart_pos_kds?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set the server password}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
      SERVER_TOMCAT_THREADS_MAX: "40"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "5"
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 JWT secret}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m -Xss512k -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_SERVER_ADDRESS: "127.0.0.1"
      MANAGEMENT_SERVER_PORT: "8081"
      API_DOCS_ENABLED: "false"
      SHOW_SQL: "false"
      PAYMENT_MOCK_ENABLED: "false"
      DEMO_ACCOUNTS_ENABLED: "false"
      PAYMENT_RECONCILE_ENABLED: "false"
      VNPAY_ENABLED: ${VNPAY_ENABLED:-false}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      VNPAY_EXPIRE_SECONDS: ${VNPAY_EXPIRE_SECONDS:-90}
      CUSTOMER_PUBLIC_BASE_URL: https://${DEPLOY_IP:?Set the server public IPv4}
      PUBLIC_BASE_URL: https://${DEPLOY_IP:?Set the server public IPv4}
      WS_ALLOWED_ORIGINS: https://${DEPLOY_IP:?Set the server public IPv4},https://${DEPLOY_IP:?Set the server public IPv4}:8443,https://${DEPLOY_IP:?Set the server public IPv4}:8444,https://${DEPLOY_IP:?Set the server public IPv4}:8445
    volumes:
      - admin_uploads:/app/uploads/admin
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "4", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    depends_on:
      mysql-db:
        condition: service_healthy
    logging: *bounded-logs
    networks: [application]

  frontend:
    image: ${FRONTEND_IMAGE:?Use images.env from a published release}
    restart: unless-stopped
    mem_limit: 96m
    environment:
      CUSTOMER_PUBLIC_BASE_URL: https://${DEPLOY_IP:?Set the server public IPv4}/
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx-routes.conf:/etc/nginx/deploy-routes.conf:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    logging: *bounded-logs
    networks: [application]

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    mem_limit: 96m
    environment:
      DEPLOY_IP: ${DEPLOY_IP:?Set the server public IPv4}
      ACME_EMAIL: ${ACME_EMAIL:?Set your ACME contact email}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
    volumes:
      - ./deploy/Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging: *bounded-logs
    networks: [application]

networks:
  application:
volumes:
  mysql_data:
  admin_uploads:
  caddy_data:
  caddy_config:
