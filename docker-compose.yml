services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  mysql-db:
    image: mysql:8.0
    container_name: dacn08_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: smart_pos_kds
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Tự động import dữ liệu mẫu khi khởi tạo container database lần đầu
      - ./sample_database.26.7.10.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dacn_network
    healthcheck:
      test: [ "CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # 2. Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dacn08_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/smart_pos_kds?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_OUTPUT_ANSI_ENABLED=never
      - LOGGING_CHARSET_CONSOLE=UTF-8
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - dacn_network

  # 3. Frontend React/Vite (Nginx host port 80 & reverse proxy /api sang backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dacn08_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - dacn_network

networks:
  dacn_network:
    driver: bridge

volumes:
  mysql_data:
