services:
  mysql-db:
    ports: !reset []

  backend:
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    ports: !reset []
    environment:
      SPRING_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_SERVER_ADDRESS: "127.0.0.1"
      MANAGEMENT_SERVER_PORT: "8081"
      CUSTOMER_PUBLIC_BASE_URL: https://customer.${DEPLOY_DOMAIN:?Set DEPLOY_DOMAIN in .env}
      PUBLIC_BASE_URL: https://customer.${DEPLOY_DOMAIN:?Set DEPLOY_DOMAIN in .env}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  frontend:
    build:
      args:
        VITE_CUSTOMER_URL: https://customer.${DEPLOY_DOMAIN:?Set DEPLOY_DOMAIN in .env}/
    ports: !reset []
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx-routes.conf:/etc/nginx/deploy-routes.conf:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?Set DEPLOY_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - restaurant_management_network

volumes:
  caddy_data:
  caddy_config:
