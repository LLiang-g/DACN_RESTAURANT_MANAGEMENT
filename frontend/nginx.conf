# 4 giao diện, mỗi giao diện một cổng trong container:
#   80 -> customer | 81 -> pos | 82 -> kds | 83 -> admin
# Cổng ngoài máy được map trong docker-compose.yml (biến trong .env).
# Cả 4 đều chuyển /api và /ws sang backend Spring Boot (service "backend", cổng 8080).

# ---------- Customer (cổng 80) ----------
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html/customer;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }
}

