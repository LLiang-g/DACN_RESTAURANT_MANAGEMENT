name: Restaurant CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      known_gaps:
        description: 'Also run unresolved bug checks (may fail)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: restaurant-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    name: Build and business E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json
      - name: Check Docker and schema contract
        run: |
          docker version
          docker compose version
          node tests/e2e-infra/refresh-schema.cjs --check
      - name: Install test dependencies
        run: npm --prefix frontend/admin ci --no-audit --no-fund
      - name: Install Chromium and Linux libraries
        working-directory: frontend/admin
        run: npx --no-install playwright install --with-deps chromium
      - name: Build application and start isolated test stack
        id: stack
        run: node tests/e2e-infra/run.cjs up
      - name: Admin utility tests
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: npm --prefix frontend/admin run test:admin
      - name: Main business suite
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: node tests/e2e/run.cjs test
      - name: Payment signature and Return suite (local provider)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: node tests/e2e/run.cjs vnpay
      - name: Scheduler suite
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: node tests/e2e/run.cjs auto-cancel
      - name: Unresolved bugs (manual opt-in)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.known_gaps }}
        run: node tests/e2e/run.cjs known-gaps
      - name: Gather execution coverage
        if: ${{ always() }}
        run: node tests/e2e/coverage.cjs
      - name: Prepare report and job summary
        if: ${{ always() }}
        run: node tests/ci/report.cjs
      - name: Stop isolated test stack
        if: ${{ always() }}
        run: node tests/e2e-infra/run.cjs down
      - name: Upload test summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7

  publish-images:
    name: Publish images and server bundle
    needs: build-and-e2e
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare lowercase image namespace
        id: names
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.base }}-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-backend
          cache-to: type=gha,mode=max,scope=release-backend
      - name: Build and publish frontend (runtime Customer URL)
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.base }}-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-frontend
          cache-to: type=gha,mode=max,scope=release-frontend
      - name: Build and publish MySQL initialization image
        id: database
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/release/Database.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.base }}-database:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Prepare server-only configuration bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          DATABASE_DIGEST: ${{ steps.database.outputs.digest }}
        run: node tests/ci/package-release.cjs
      - name: Validate standalone server configuration
        env:
          DEPLOY_IP: 203.0.113.10
          ACME_EMAIL: ci@example.com
          MYSQL_ROOT_PASSWORD: CI_VALIDATION_ONLY
          JWT_SECRET: CI_VALIDATION_ONLY
        run: docker compose --env-file release-bundle/images.env -f release-bundle/compose.images.yml config --quiet
      - name: Smoke published images with 2 GiB deployment limits
        env:
          DEPLOY_IP: 203.0.113.10
          ACME_EMAIL: ci@example.com
        shell: bash
        run: |
          export MYSQL_ROOT_PASSWORD="$(openssl rand -hex 24)"
          export JWT_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$MYSQL_ROOT_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          dc() { docker compose -p smart-pos-kds-release-check --env-file release-bundle/images.env -f release-bundle/compose.images.yml "$@"; }
          cleanup() { dc down; }
          trap cleanup EXIT
          dc up -d --no-build --wait --wait-timeout 240 mysql-db backend frontend
          dc exec -T frontend cat /usr/share/nginx/html/admin/runtime-config.js | grep -F 'https://203.0.113.10/'
          dc exec -T frontend wget -q -O /dev/null http://127.0.0.1/api/customer/menu
          dc run --rm --no-deps --entrypoint caddy caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null
      - name: Archive server configuration
        run: tar -czf smart-pos-kds-server.tar.gz -C release-bundle .
      - name: Upload server bundle
        uses: actions/upload-artifact@v4
        with:
          name: server-release-${{ github.sha }}
          path: smart-pos-kds-server.tar.gz
          retention-days: 14
          if-no-files-found: error
